<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>EmbyVerse</title>
<!-- Samsung: API del reproductor (AVPlay) y del control. En LG o navegador no existe y se ignora. -->
<script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
<div id="root"></div>
<video id="bgvideo" playsinline></video>
<object id="avplayer" type="application/avplayer" style="position:fixed;left:0;top:0;width:1920px;height:1080px;z-index:0;display:none"></object>
<script>
/* Diagnóstico (ES5, corre aunque la app no pueda): si a los 15 s la pantalla sigue vacía, muestra el error y el modelo
   del equipo, y lo manda al panel (Estadísticas › Fallos). Sirve para TVs con un navegador muy viejo. */
(function () {
  var errs = [];
  window.onerror = function (m, src, line) { errs.push(String(m) + (src ? ' @ ' + String(src).split('/').pop() + ':' + line : '')); };
  setTimeout(function () {
    var root = document.getElementById('root');
    if (!root || root.children.length) return;
    var ua = navigator.userAgent || '';
    var msg = errs[0] || 'La app no arrancó (sin error)';
    var box = document.createElement('div');
    box.setAttribute('style', 'position:fixed;left:120px;top:160px;right:120px;color:#fff;font:36px/1.5 sans-serif;z-index:99');
    box.innerHTML = '<div style="font-size:54px;font-weight:bold;margin-bottom:24px">No se pudo abrir la app en esta TV</div>' +
      '<div>Toma una foto de esta pantalla y mándala a tu vendedor.</div>' +
      '<div style="margin-top:30px;font-size:28px;color:#9fb0c8">' + msg.replace(/</g, '&lt;') + '</div>' +
      '<div style="margin-top:12px;font-size:24px;color:#7f8ea4">' + ua.replace(/</g, '&lt;') + '</div>';
    document.body.style.background = '#02050C'; document.body.appendChild(box);
    try {
      var x = new XMLHttpRequest();
      x.open('GET', 'https://ositovela-a11y.github.io/EmbyVerseTV/config/stats.json?t=' + new Date().getTime());
      x.onload = function () {
        try {
          var url = JSON.parse(x.responseText).url; if (!url) return;
          var y = new XMLHttpRequest(); y.open('POST', url.replace(/\/$/, '') + '/v1/crash'); y.setRequestHeader('content-type', 'application/json');
          y.send(JSON.stringify({ id: 'arranque-' + String(Math.random()).slice(2, 12), app: '', platform: /Web0S|webOS/i.test(ua) ? 'lg' : (window.tizen ? 'samsung' : 'otro'),
            version: 'arranque', kind: 'js', message: ('No arrancó: ' + msg).slice(0, 290), detail: ua + '\n' + errs.join('\n'), model: /Web0S|webOS/i.test(ua) ? 'LG Smart TV' : 'Smart TV', os: ua.slice(0, 40) }));
        } catch (e) {}
      };
      x.send();
    } catch (e) {}
  }, 15000);
})();
</script>
<script>
/* Actualización automática: si en el sitio hay una versión más nueva de la app de TV, se carga esa
   (sin reinstalar); si no hay internet o falla, se usa la que viene instalada. */
(function () {
  var REMOTE = 'https://ositovela-a11y.github.io/EmbyVerseTV/tv/';
  var LOCAL = '__VERSION__';
  function cmp(a, b) { a = String(a).split('.'); b = String(b).split('.'); for (var i = 0; i < 3; i++) { var d = (parseInt(a[i], 10) || 0) - (parseInt(b[i], 10) || 0); if (d) return d; } return 0; }
  function boot(base) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = base + 'app.css'; document.head.appendChild(l);
    var s = document.createElement('script'); s.src = base + 'app.js';
    s.onerror = function () { if (base) { l.parentNode.removeChild(l); boot(''); } };
    document.body.appendChild(s);
  }
  if (location.protocol === 'http:' && location.hostname === 'localhost') return boot('');
  // Versión de Microsoft Store: solo el código que revisó Microsoft (las actualizaciones llegan por la tienda).
  if (window.__EV__ && window.__EV__.store) return boot('');
  try {
    var x = new XMLHttpRequest(); x.timeout = 3500; x.open('GET', REMOTE + 'version.json?t=' + Date.now());
    x.onload = function () { try { if (cmp(JSON.parse(x.responseText).version, LOCAL) > 0) return boot(REMOTE); } catch (e) {} boot(''); };
    x.onerror = x.ontimeout = function () { boot(''); };
    x.send();
  } catch (e) { boot(''); }
})();
</script>
</body>
</html>
