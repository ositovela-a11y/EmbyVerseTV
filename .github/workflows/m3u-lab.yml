name: Laboratorio M3U (listas reales)
# Instala la app en un emulador Android, la conecta a un proveedor simulado GRANDE
# (tests/android/mock-xtream.mjs) y recorre películas, series y canales reproduciendo.
on:
  workflow_dispatch:
concurrency: { group: m3u-lab, cancel-in-progress: true }
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: SDK (plataforma 37)
        run: |
          set +o pipefail
          SDK=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDK --licenses > /dev/null || true
          $SDK --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null || $SDK --install "platforms;android-37" > /dev/null || true
      - name: Compilar app y pruebas
        working-directory: android-app
        run: |
          set -o pipefail
          { ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest; } 2>&1 | tee build.log || {
            { grep -E '^e: |ERROR|Missing class|R8:' build.log | head -30; awk '/What went wrong:/{f=1} /\* Try:/{f=0} f' build.log | head -30; } > errors.txt
            split -l 6 errors.txt chunk_ || true
            for f in $(ls chunk_* 2>/dev/null | head -10); do msg=$(sed 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}'); echo "::error::$msg"; done
            exit 1; }
      - name: Emulador y laboratorio
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r -e class com.embyverse.app.M3uLabTest com.embyverse.app.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt || true
            adb logcat -d -s EVLAB:I > lab.txt || true
      - name: Resultado
        if: always()
        run: |
          sed 's/^.*EVLAB[^:]*: //' lab.txt | tee resultado.txt
          tail -5 instrument.txt || true
