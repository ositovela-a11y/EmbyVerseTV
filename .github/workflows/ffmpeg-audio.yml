# Decodificador de audio FFmpeg para el reproductor Android (Media3): permite oír películas y series con
# audio AC3 (Dolby Digital), E-AC3 (Dolby Digital Plus), DTS y TrueHD en celulares y TV que no traen ese
# decodificador (antes se veían sin sonido). FFmpeg se compila en modo LGPL (sin --enable-gpl), solo audio.
# Resultado: publicación «ffmpeg-media3-<versión>» con lib-decoder-ffmpeg-release.aar, que las
# compilaciones de la app descargan solas.
name: Decodificador de audio (FFmpeg)
on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths: ['.github/workflows/ffmpeg-audio.yml']
permissions:
  contents: write
jobs:
  aar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEDIA3: '1.11.1'
      FFMPEG_BRANCH: 'release/6.0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: ¿Ya existe?
        id: have
        run: |
          if gh release view "ffmpeg-media3-$MEDIA3" -R ${{ github.repository }} --json assets -q '.assets[].name' 2>/dev/null | grep -q '\.aar$'; then echo "ok=1" >> $GITHUB_OUTPUT; echo "::notice::Ya está compilado para Media3 $MEDIA3"; fi
      - name: Código de Media3 y FFmpeg
        if: steps.have.outputs.ok != '1'
        run: |
          git clone -q --depth 1 --branch "$MEDIA3" https://github.com/androidx/media.git media
          git clone -q --depth 1 --branch "$FFMPEG_BRANCH" https://github.com/FFmpeg/FFmpeg.git ffmpeg
      - name: Compilar FFmpeg (solo audio, LGPL)
        if: steps.have.outputs.ok != '1'
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"; echo "NDK: $NDK"
          MOD="$PWD/media/libraries/decoder_ffmpeg/src/main"
          ln -s "$PWD/ffmpeg" "$MOD/jni/ffmpeg"
          cd "$MOD/jni" && ./build_ffmpeg.sh "$MOD" "$NDK" linux-x86_64 21 vorbis opus flac alac pcm_mulaw pcm_alaw mp3 aac ac3 eac3 dca mlp truehd
          ls -R "$MOD/jni/ffmpeg/android-libs" | head -20
      - name: Compilar la librería (AAR)
        if: steps.have.outputs.ok != '1'
        working-directory: media
        run: |
          ./gradlew --no-daemon -q lib-decoder-ffmpeg:assembleRelease
          AAR=$(find libraries/decoder_ffmpeg -name '*release*.aar' | head -1); echo "AAR: $AAR"; ls -la "$AAR"
          unzip -l "$AAR" | grep '\.so' || true
          cp "$AAR" ../lib-decoder-ffmpeg-release.aar
      - name: Publicar
        if: steps.have.outputs.ok != '1'
        run: |
          cat > notes.md <<NOTES
          Decodificador de audio FFmpeg para Media3 $MEDIA3 (AC3, E-AC3, DTS, TrueHD, AAC, MP3, Opus, Vorbis, FLAC, ALAC).
          FFmpeg $FFMPEG_BRANCH compilado sin --enable-gpl (LGPL 2.1). Código fuente: https://github.com/FFmpeg/FFmpeg/tree/$FFMPEG_BRANCH ·
          extensión de Media3 (Apache 2.0): https://github.com/androidx/media/tree/$MEDIA3/libraries/decoder_ffmpeg
          NOTES
          gh release create "ffmpeg-media3-$MEDIA3" lib-decoder-ffmpeg-release.aar -R ${{ github.repository }} --title "Audio FFmpeg (Media3 $MEDIA3)" --notes-file notes.md --prerelease
