# App para TVs Samsung (Tizen) y LG (webOS): compila, prueba en un navegador de TV simulado y arma los paquetes.
#   main → release «tv-latest» (EmbyVerse-Samsung.wgt sin firmar, EmbyVerse-LG.ipk, copia web para actualizar sola)
#   beta → release «tv-beta» (revisión)
name: App TV (Samsung y LG)
on:
  push:
    branches: [main, beta]
    paths: ['tv-app/**', 'tests/android/mock-xtream.mjs', '.github/workflows/tv.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Instalar y compilar
        working-directory: tv-app
        run: |
          npm install --no-audit --no-fund
          node build.mjs --package
          ls -la dist-pkg
      - name: Prueba en navegador (proveedor simulado)
        run: |
          npm i --no-save --prefix /tmp/pw playwright@1.48.2 >/dev/null && (cd /tmp/pw && npx playwright install --with-deps chrome >/dev/null)
          (cd tests/android && node mock-xtream.mjs > /tmp/mock.log 2>&1 &)
          cd tv-app && EMBYVERSE_HOST=http://127.0.0.1:8800 EMBYVERSE_CONFIG_URL=http://127.0.0.1:8090/none.json node build.mjs
          (cd dist && python3 -m http.server 8090 >/dev/null 2>&1 &)
          sleep 3
          NODE_PATH=/tmp/pw/node_modules node tests/e2e.cjs /tmp/tvshots
      - name: Capturas de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: tv-capturas, path: /tmp/tvshots, if-no-files-found: ignore }
      - name: Publicar paquetes
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd tv-app
          node build.mjs --package >/dev/null
          (cd dist && zip -qr ../dist-pkg/EmbyVerse-TV-web.zip .)
          TAG=$([ "$GITHUB_REF_NAME" = main ] && echo tv-latest || echo tv-beta)
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "App TV ($TAG)" --notes "EmbyVerse para Samsung y LG"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist-pkg/EmbyVerse-Samsung.wgt dist-pkg/EmbyVerse-LG.ipk dist-pkg/EmbyVerse-TV-web.zip --clobber
