# App para PC (Windows): la app de TV dentro de Electron, con listas M3U y cuentas Xtream. De pago:
# cada equipo se activa desde el panel (Activaciones). Una app por marca: la principal y una por vendedor.
#   1) Prueba en Linux con el proveedor simulado como app de un vendedor: activación, nombre y logotipo
#      del vendedor, Xtream con URL y lista M3U (canales HLS, sin extensión, con User-Agent y Referer).
#   2) Arma el instalador y la versión portátil de Windows de cada marca → release «pc-latest» (main) o «pc-beta» (beta).
name: App PC (Windows)
on:
  push:
    branches: [main, beta]
    paths: ['desktop/**', 'tv-app/**', 'tests/android/mock-xtream.mjs', 'tests/fixtures/pc-vendor.json', 'web-player/config/vendors/**', '.github/workflows/pc.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Compilar la app con el proveedor simulado
        run: |
          cd tv-app && npm install --no-audit --no-fund
          EMBYVERSE_HOST=http://127.0.0.1:8800 EMBYVERSE_CONFIG_URL=http://127.0.0.1:8090/none.json node build.mjs
          rm -rf ../desktop/app && cp -r dist ../desktop/app
          cd ../desktop && npm install --no-audit --no-fund && npm i --no-save playwright@1.48.2 sharp@0.33.5
          node brand.mjs --slug prueba --config ../tests/fixtures/pc-vendor.json --config-url http://127.0.0.1:8800/cfg/vendor.json --license-url http://127.0.0.1:8800/licenses.json
      - name: Probar
        timeout-minutes: 25
        run: |
          (cd tests/android && node mock-xtream.mjs > /tmp/mock.log 2>&1 &)
          sleep 3
          (cd desktop && node tests/lg-installer.test.cjs)
          cd desktop && xvfb-run -a -s "-screen 0 1920x1080x24" node tests/e2e.cjs /tmp/pcshots
          # App principal («Everse»): nombre, logotipo, 7 días de prueba y «otro servidor».
          git checkout -- package.json icon.png && rm -rf app && cp -r ../tv-app/dist app
          node brand.mjs --config-url http://127.0.0.1:8800/cfg/principal.json --license-url http://127.0.0.1:8800/licenses.json
          xvfb-run -a -s "-screen 0 1920x1080x24" node tests/principal.cjs /tmp/pcshots
      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: pc-capturas, path: /tmp/pcshots, if-no-files-found: ignore }
  windows:
    needs: prueba
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Compilar la app
        shell: bash
        run: cd tv-app && npm install --no-audit --no-fund && node build.mjs
      - name: Instalador y portátil de Windows (principal y vendedores)
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          (cd desktop && npm install --no-audit --no-fund && npm i --no-save sharp@0.33.5)
          SLUGS=$(node -p "try{require('./web-player/config/vendors/index.json').map(v=>v.slug).filter(s=>/^[a-z][a-z0-9]{1,30}$/.test(s)).join(' ')}catch(e){''}")
          for slug in principal $SLUGS; do
            git checkout -- desktop/package.json desktop/icon.png
            rm -rf desktop/app && cp -r tv-app/dist desktop/app
            if [ "$slug" = principal ]; then node desktop/brand.mjs; else node desktop/brand.mjs --slug "$slug"; fi
            (cd desktop && npx electron-builder --win nsis portable --x64 --publish never)
          done
          git checkout -- desktop/package.json desktop/icon.png
          ls -la desktop/dist
      # Paquete para Microsoft Store (solo tu app; Microsoft lo firma al publicarlo). Los 3 datos de identidad salen
      # de Partner Center → Identidad del producto, y se guardan como VARIABLES del repositorio (no son secretos):
      # MS_IDENTITY_NAME, MS_PUBLISHER (CN=…) y MS_PUBLISHER_NAME. Opcional: MS_DISPLAY_NAME (nombre reservado).
      # Sin esas variables se arma un paquete de PRUEBA (no sirve para subirlo) solo para comprobar que compila.
      - name: Paquete para Microsoft Store (MSIX)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ID_NAME: ${{ vars.MS_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MS_PUBLISHER }}
          PUB_NAME: ${{ vars.MS_PUBLISHER_NAME }}
          DISPLAY: ${{ vars.MS_DISPLAY_NAME }}
        run: |
          rm -rf desktop/app && cp -r tv-app/dist desktop/app
          node desktop/brand.mjs --store
          node desktop/tienda.mjs
          V=$(node -p "require('./tv-app/package.json').version")
          # La tienda exige un número de versión mayor en cada envío: el de la app de PC/TV (1.2.10 → 1.2.10.0).
          node -e "const f='desktop/package.json',p=require('./'+f);p.version='$V';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          if [ -n "$ID_NAME" ] && [ -n "$PUBLISHER" ]; then REAL=1; else REAL=0; ID_NAME=EverseTV.Prueba; PUBLISHER='CN=00000000-0000-0000-0000-000000000000'; PUB_NAME=Prueba; echo "::notice::Sin datos de Partner Center: paquete de PRUEBA"; fi
          NAME=${DISPLAY:-$(node -p "require('./desktop/package.json').productName")}
          (cd desktop && npx electron-builder --win appx --x64 --publish never \
            -c.appx.identityName="$ID_NAME" -c.appx.publisher="$PUBLISHER" -c.appx.publisherDisplayName="$PUB_NAME" \
            -c.appx.displayName="$NAME" -c.appx.applicationId=EverseTV -c.appx.backgroundColor="#03070F" \
            -c.appx.languages=es-MX -c.appx.languages=en-US \
            -c.appx.artifactName="Tienda-Microsoft$([ $REAL = 1 ] || echo -PRUEBA).\${ext}")
          git checkout -- desktop/package.json desktop/icon.png
          ls -la desktop/dist/*.appx
      - name: Publicar
        shell: bash
        # main → «pc-nueva» (espera a que el dueño pulse «Actualizar versión» en el panel); beta → «pc-beta».
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$([ "$GITHUB_REF_NAME" = main ] && echo pc-nueva || echo pc-beta)
          DEST="$GITHUB_REPOSITORY"
          echo "{\"version\": \"$(node -p "require('./tv-app/package.json').version")\", \"build\": \"${GITHUB_SHA::7}-${GITHUB_RUN_ID}\"}" > desktop/dist/pc-version.json
          gh release view "$TAG" -R "$DEST" >/dev/null 2>&1 || gh release create "$TAG" -R "$DEST" --title "App PC ($TAG)" --notes "EmbyVerse para Windows: instalador y versión portátil."
          gh release upload "$TAG" -R "$DEST" desktop/dist/*-PC-Instalador.exe desktop/dist/*-PC-Portable.exe desktop/dist/pc-version.json --clobber
          # El paquete de la tienda va aparte (repositorio del código): lo subes tú en Partner Center.
          gh release view tienda-microsoft -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create tienda-microsoft -R "$GITHUB_REPOSITORY" --prerelease --title "Paquete para Microsoft Store" --notes "Descarga el .appx y súbelo en Partner Center → Paquetes."
          gh release upload tienda-microsoft -R "$GITHUB_REPOSITORY" desktop/dist/*.appx --clobber
