# Compila EmbyVerse.apk en los servidores de GitHub y lo publica con un enlace fijo:
#   https://github.com/<usuario>/<repositorio>/releases/download/apk-latest/EmbyVerse.apk
name: APK Android
on:
  push:
    branches: [main]
    paths: ['android-app/**', 'shared/**', 'web-player/config/**', 'scripts/apply-brand.mjs', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  # Una APK por app: la principal y una por cada vendedor creado en el Design Studio
  # (web-player/config/vendors/index.json). Cada una con su nombre, logotipo, colores e identificador.
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        run: |
          node -e '
            const fs = require("fs");
            const base = "https://ositovela-a11y.github.io/EmbyVerseTV/config";
            const list = [{ slug: "", name: "Principal", config: "web-player/config/app.json", url: base + "/app.json", asset: "EmbyVerse.apk" }];
            try {
              for (const v of JSON.parse(fs.readFileSync("web-player/config/vendors/index.json", "utf8"))) {
                if (!/^[a-z][a-z0-9]{1,30}$/.test(v.slug)) continue;
                list.push({ slug: v.slug, name: v.name, config: `web-player/config/vendors/${v.slug}.json`, url: `${base}/vendors/${v.slug}.json`, asset: `EmbyVerse-${v.slug}.apk` });
              }
            } catch {}
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify({ include: list }) + "\n");
            console.log(list.map((x) => x.asset).join(", "));
          '
  build:
    needs: targets
    name: APK ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar Android SDK
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          (yes || true) | "$SDKM" --licenses > /dev/null 2>&1 || true
          AVAIL=$("$SDKM" --list 2>/dev/null | grep -oE 'platforms;android-[0-9A-Za-z.-]+' | sort -u | tail -8 | tr '\n' ' ')
          echo "::notice::Plataformas disponibles: $AVAIL"
          "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0" 2>&1 | tail -3 || true
          "$SDKM" --install "platforms;android-37" 2>&1 | tail -3 || true
          echo "::notice::Instaladas: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Aplicar nombre y logotipo del Design Studio
        run: |
          mkdir -p /tmp/sharp && (cd /tmp/sharp && npm init -y > /dev/null && npm i --silent sharp@0.34.4 > /dev/null)
          SHARP_DIR=/tmp/sharp node scripts/apply-brand.mjs "${{ matrix.config }}"
      - name: Pruebas del núcleo y compilación
        id: build
        working-directory: android-app
        env:
          # La app lee el diseño publicado desde GitHub Pages (Design Studio).
          EMBYVERSE_CONFIGURL: ${{ matrix.url }}
          EMBYVERSE_VENDOR: ${{ matrix.slug }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace ${{ matrix.slug == '' && ':core:test' || '' }} :app:assembleDebug 2>&1 | tee build.log
      - name: Mostrar errores de compilación
        if: failure()
        working-directory: android-app
        run: |
          { grep -E '^e: ' build.log | head -40
            awk '/What went wrong:/{f=1} /\* Try:/{f=0} f' build.log | head -40
            grep -E 'error:|Unresolved|FAILED' build.log | grep -v '^e: ' | head -20; } > errors.txt || true
          { echo '## Errores'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Máximo 10 anotaciones por paso: se agrupan de 6 en 6 líneas.
          split -l 6 errors.txt chunk_ || true
          for f in $(ls chunk_* 2>/dev/null | head -10); do
            msg=$(sed 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}'); echo "::error::$msg"
          done
      - name: Publicar APK
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "${{ matrix.asset }}"
          NOTES="APK de prueba compilado desde ${GITHUB_SHA::7} el $(date -u '+%Y-%m-%d %H:%M UTC'). Firmado con la clave de depuración del proyecto."
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "EmbyVerse (última compilación)" --notes "$NOTES" --latest
          if [ -z "${{ matrix.slug }}" ]; then gh release edit apk-latest --notes "$NOTES"; fi
          gh release upload apk-latest "${{ matrix.asset }}" --clobber
  # Borra del release las APK de vendedores que ya no existen.
  cleanup:
    needs: [targets, build]
    if: always() && needs.targets.result == 'success'
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}', MATRIX: '${{ needs.targets.outputs.matrix }}' }
    steps:
      - run: |
          keep=$(echo "$MATRIX" | jq -r '.include[].asset')
          for a in $(gh release view apk-latest -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -E '^EmbyVerse-.+\.apk$' || true); do
            echo "$keep" | grep -qx "$a" || { echo "Eliminando $a"; gh release delete-asset apk-latest "$a" -R "$GITHUB_REPOSITORY" -y; }
          done
