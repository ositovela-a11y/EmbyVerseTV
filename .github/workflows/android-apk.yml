# Compila EmbyVerse.apk en los servidores de GitHub y lo publica con un enlace fijo:
#   https://github.com/<usuario>/<repositorio>/releases/download/apk-latest/EmbyVerse.apk
name: APK Android
on:
  push:
    branches: [main]
    paths: ['android-app/**', 'shared/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar Android SDK 36
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "ANDROID_HOME=$ANDROID_HOME  sdkmanager=$SDKM"
          (yes || true) | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          test -d "$ANDROID_HOME/platforms/android-36" || { echo "::error::No se pudo instalar platforms;android-36"; "$SDKM" --list 2>/dev/null | grep -E 'platforms;android-3[5-9]' | head; exit 1; }
      - name: Pruebas del núcleo y compilación
        id: build
        working-directory: android-app
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :core:test :app:assembleDebug 2>&1 | tee build.log
      - name: Mostrar errores de compilación
        if: failure()
        working-directory: android-app
        run: |
          { grep -E '^e: ' build.log | head -40
            awk '/What went wrong:/{f=1} /\* Try:/{f=0} f' build.log | head -40
            grep -E 'error:|Unresolved|FAILED' build.log | grep -v '^e: ' | head -20; } > errors.txt || true
          { echo '## Errores'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Máximo 10 anotaciones por paso: se agrupan de 6 en 6 líneas.
          split -l 6 errors.txt chunk_ || true
          for f in $(ls chunk_* 2>/dev/null | head -10); do
            msg=$(sed 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}'); echo "::error::$msg"
          done
      - name: Publicar APK
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk EmbyVerse.apk
          NOTES="APK de prueba compilado desde ${GITHUB_SHA::7} el $(date -u '+%Y-%m-%d %H:%M UTC'). Firmado con la clave de depuración del proyecto."
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "EmbyVerse (última compilación)" --notes "$NOTES" --latest
          gh release edit apk-latest --notes "$NOTES"
          gh release upload apk-latest EmbyVerse.apk --clobber
