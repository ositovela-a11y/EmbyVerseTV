# Dominio propio (eversetv.com): prueba y publica el servidor que pone tu dirección delante del sitio.
# No cambia nada para las apps instaladas (siguen usando la dirección de siempre).
name: Dominio propio
on:
  push:
    branches: [main, beta]
    paths: ['site-worker/**', '.github/workflows/site-worker.yml']
  workflow_dispatch:
concurrency:
  group: site-worker
  cancel-in-progress: false
jobs:
  sitio:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --no-warnings site-worker/test/site.test.mjs
      - name: Publicar en Cloudflare
        working-directory: site-worker
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN"; exit 0; }
          npm i -g wrangler@4 > /dev/null 2>&1
          for i in 1 2 3; do wrangler deploy && break; sleep 15; done
      - name: ¿Ya responde tu dominio?
        run: |
          for u in https://eversetv.com/ https://eversetv.com/a/?v=planetatv https://eversetv.com/apk/EmbyVerse.apk https://www.eversetv.com/ https://eversetv-site.ositovela.workers.dev/; do
            printf '%s → ' "$u"; curl -s -o /dev/null -I -m 20 -w '%{http_code} %{content_type} %{redirect_url}\n' "$u" || echo "sin respuesta"
          done
          if curl -fsS -m 20 https://eversetv.com/a/ -o /dev/null; then echo "::notice::eversetv.com ya funciona"; else echo "::notice::eversetv.com todavía no está conectado (falta agregar el dominio al servidor en Cloudflare)"; fi
