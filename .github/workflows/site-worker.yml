# Dominio propio (eversetv.com): prueba y publica el servidor que pone tu dirección delante del sitio.
# No cambia nada para las apps instaladas (siguen usando la dirección de siempre).
name: Dominio propio
on:
  push:
    branches: [main, beta]
    paths: ['site-worker/**', '.github/workflows/site-worker.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-worker
  cancel-in-progress: false
jobs:
  sitio:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --no-warnings site-worker/test/site.test.mjs
      - name: Copia del sitio (por si GitHub falla)
        run: |
          mkdir -p site-worker/copia
          if git fetch -q --depth 1 https://github.com/ositovela-a11y/EmbyVerseTV.git gh-pages 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C site-worker/copia
            rm -f site-worker/copia/CNAME
            # Instaladores de PC publicados (los que se bajan en /descargas/pc/).
            mkdir -p site-worker/copia/descargas/pc
            GH_TOKEN=${{ secrets.SITE_TOKEN || github.token }} gh release download pc-latest -R ositovela-a11y/EmbyVerseTV -p '*-PC-*.exe' -D site-worker/copia/descargas/pc --clobber || echo "::warning::sin instaladores de PC en la copia"
            # Cloudflare acepta archivos de hasta 25 MB: los grandes (APK, instaladores) van en partes de 24 MB.
            find site-worker/copia -type f -size +24M | while read -r f; do
              size=$(stat -c %s "$f"); split -b 24M -d -a 3 "$f" "$f.parte"
              n=$(ls "$f".parte* | wc -l); echo "{\"size\": $size, \"partes\": $n}" > "$f.partes.json"; rm "$f"
            done
            echo "Copia: $(find site-worker/copia -type f | wc -l) archivos, $(du -sh site-worker/copia | cut -f1)"
          else echo "::warning::No se pudo leer el sitio publicado: el Worker queda sin copia nueva"; echo ok > site-worker/copia/.vacia; fi
      - name: Publicar en Cloudflare
        # Solo desde main: eversetv.com es lo que ven tus clientes (en beta solo se prueba).
        if: github.ref_name == 'main'
        working-directory: site-worker
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN"; exit 0; }
          npm i -g wrangler@4 > /dev/null 2>&1
          ok=0; for i in 1 2 3; do wrangler deploy 2>&1 | tee d.txt; grep -q "Deployed" d.txt && { ok=1; break; }; sleep 15; done
          if [ $ok = 0 ]; then echo "::warning::No se pudo conectar el dominio con la llave actual; se publica sin él"; sed -i "/^routes/,/^]/d" wrangler.toml; wrangler deploy; fi
          sleep 60
      - name: ¿Ya responde tu dominio?
        if: github.ref_name == 'main'
        run: |
          for u in https://eversetv.com/ https://eversetv.com/a/?v=planetatv https://eversetv.com/apk/EmbyVerse.apk https://www.eversetv.com/ https://eversetv-site.ositovela.workers.dev/; do
            printf '%s → ' "$u"; curl -s -o /dev/null -I -m 20 -w '%{http_code} %{content_type} %{redirect_url}\n' "$u" || echo "sin respuesta"
          done
          if curl -fsS -m 20 https://eversetv.com/a/ -o /dev/null; then echo "::notice::eversetv.com ya funciona"; else echo "::notice::eversetv.com todavía no está conectado (falta agregar el dominio al servidor en Cloudflare)"; fi
      - name: Capturas
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd site-worker/test && npm i --no-save playwright@1.48.2 > /dev/null 2>&1 && npx playwright install --with-deps chromium > /dev/null 2>&1
          node shots.mjs && gh release upload ci-logs dominio-pagina-celular.png dominio-pagina-pc.png --clobber -R ${{ github.repository }}
