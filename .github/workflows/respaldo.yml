# Respaldo completo para volver a levantar todo rápido y como estaba:
#  - repositorio completo con historia y TODAS las ramas (EmbyVerse-repo.bundle) + código de main en zip,
#  - el contexto del proyecto para Claude (CLAUDE.md) y la guía de recuperación (docs/RECUPERACION.md),
#  - las apps publicadas: 4 APK (una por marca), instaladores de PC, Samsung (.wgt), LG (.ipk) y FFmpeg,
#  - el sitio publicado (rama gh-pages: página, panel, configs de diseño, activaciones, bloqueos),
#  - la base de datos de estadísticas y perfiles (Cloudflare D1) CIFRADA con tu STATS_ADMIN_KEY,
#  - SOLO si el repositorio del código es PRIVADO: tus claves (CLAVES.txt: Cloudflare, STATS_ADMIN_KEY, SITE_TOKEN y
#    los datos de la firma de las APK). Si existe el secreto BACKUP_PASSWORD, van cifradas con esa contraseña.
# Va a la publicación «respaldo-AAAA-MM-DD» del repositorio del código. Se guardan los últimos 6 respaldos.
name: Respaldo
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'   # cada lunes 3:17 am (hora de México)
permissions:
  contents: write
jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}          # aquí se guarda el respaldo (repositorio del código)
      PUB: ositovela-a11y/EmbyVerseTV          # de aquí se toman las apps publicadas
      PUB_TOKEN: ${{ secrets.SITE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, ref: main }
      - name: Repositorio completo y código
        run: |
          mkdir -p out
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          for b in $(git branch -r | grep -v HEAD | sed 's#origin/##'); do git branch -f "$b" "origin/$b" 2>/dev/null || true; done
          git bundle create out/EmbyVerse-repo.bundle --all
          git bundle verify out/EmbyVerse-repo.bundle > /dev/null && echo "bundle OK"
          git archive --format=zip -o out/EmbyVerse-codigo-main.zip main
          # El sitio publicado vive en el repositorio público (rama gh-pages).
          if git ls-remote --exit-code "https://github.com/$PUB.git" gh-pages >/dev/null 2>&1; then
            git fetch -q "https://github.com/$PUB.git" gh-pages:sitio-publicado && git archive --format=zip -o out/EmbyVerse-sitio-gh-pages.zip sitio-publicado
          else git archive --format=zip -o out/EmbyVerse-sitio-gh-pages.zip gh-pages 2>/dev/null || echo "::warning::sin gh-pages"; fi
          cp CLAUDE.md out/CLAUDE.md
          cp docs/RECUPERACION.md out/RECUPERACION.md
      - name: Apps publicadas
        run: |
          for t in apk-latest tv-latest; do GH_TOKEN="$PUB_TOKEN" gh release download "$t" -R "$PUB" -D out --clobber 2>/dev/null || echo "::warning::sin $t"; done
          # Los dos decodificadores FFmpeg se llaman igual: cada uno con su nombre.
          for t in ffmpeg-media3-1.11.1-video ffmpeg-media3-1.11.1; do mkdir -p "tmp-$t" && gh release download "$t" -R "$REPO" -D "tmp-$t" --clobber 2>/dev/null && mv "tmp-$t/lib-decoder-ffmpeg-release.aar" "out/$t.aar" || echo "::warning::sin $t"; done
          GH_TOKEN="$PUB_TOKEN" gh release download pc-latest -R "$PUB" -D out -p '*-PC-Instalador.exe' --clobber || echo "::warning::sin pc-latest"
          ls -la out
      - name: Base de datos (cifrada)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.STATS_ADMIN_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$KEY" ]; then echo "::warning::Sin secretos de Cloudflare: no se respaldó la base de datos"; exit 0; fi
          npm i -g wrangler@4 > /dev/null 2>&1
          cd stats-worker
          ID=$(wrangler d1 list --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const x=JSON.parse(s).find(d=>d.name==='embyverse-stats');console.log(x?(x.uuid||x.id||''):'')}catch{console.log('')}})")
          [ -n "$ID" ] || { echo "::warning::no existe la base embyverse-stats"; exit 0; }
          sed -i "s/database_id = \"LOCAL\"/database_id = \"$ID\"/" wrangler.toml
          wrangler d1 export embyverse-stats --remote --output ../d1.sql
          gzip -9 ../d1.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in ../d1.sql.gz -out ../out/estadisticas-d1.sql.gz.cifrado -pass env:KEY
          rm -f ../d1.sql.gz
          echo "Base de datos respaldada y cifrada ($(stat -c %s ../out/estadisticas-d1.sql.gz.cifrado) bytes)"
      - name: Claves (solo si el repositorio es privado)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.STATS_ADMIN_KEY }}
          SITE: ${{ secrets.SITE_TOKEN }}
          PASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ "$(gh api "repos/$REPO" -q .private)" != "true" ]; then echo "::warning::El repositorio es PÚBLICO: las claves NO se agregan al respaldo (cualquiera las vería)"; exit 0; fi
          umask 077
          cat > CLAVES.txt <<CLAVES
          CLAVES DE EMBYVERSE · respaldo del $(TZ=America/Mexico_City date '+%d/%m/%Y %H:%M') · guárdalas en un lugar seguro
          Se ponen en GitHub → repositorio del código → Settings → Secrets and variables → Actions.

          CLOUDFLARE_API_TOKEN = $CF_TOKEN
          CLOUDFLARE_ACCOUNT_ID = $CF_ACCOUNT
          STATS_ADMIN_KEY = $ADMIN_KEY     (también es la clave del panel de Estadísticas y abre la base de datos cifrada)
          SITE_TOKEN = $SITE     (token para publicar en el repositorio público EmbyVerseTV; vence, renuévalo en GitHub)

          FIRMA DE LAS APK (no cambiarla nunca: los clientes tendrían que reinstalar)
            archivo: android-app/app/embyverse-debug.keystore (va adjunto como firma-apk.keystore)
            contraseña del almacén: android · alias: androiddebugkey · contraseña de la clave: android

          Dominio eversetv.com y cuenta de Cloudflare: con tu correo y contraseña de Cloudflare (no se guardan aquí).
          Panel: entras con un token de GitHub (Fine-grained, Contents + Actions de lectura y escritura).
          CLAVES
          cp android-app/app/embyverse-debug.keystore firma-apk.keystore
          if [ -n "$PASS" ]; then
            zip -q -P "$PASS" out/CLAVES-cifradas.zip CLAVES.txt firma-apk.keystore && echo "Claves cifradas con BACKUP_PASSWORD"
          else
            mv CLAVES.txt firma-apk.keystore out/ && echo "::warning::Claves SIN cifrar (repositorio privado). Crea el secreto BACKUP_PASSWORD para cifrarlas."
          fi
          rm -f CLAVES.txt firma-apk.keystore
      - name: Publicar respaldo
        run: |
          TAG="respaldo-$(TZ=America/Mexico_City date +%F)"
          SHA=$(git rev-parse --short main)
          AV=$(grep -m1 versionName android-app/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/'); TV=$(node -p "require('./tv-app/package.json').version")
          cat > notes.md <<NOTES
          Respaldo completo del $(TZ=America/Mexico_City date '+%d/%m/%Y %H:%M') · main \`$SHA\` · Android $AV · TV/PC $TV

          Para volver a levantar todo, sigue **RECUPERACION.md** (va adjunto). Resumen:
          1. \`git clone EmbyVerse-repo.bundle EmbyVerseTV\` (repositorio completo con todas las ramas) y súbelo a un repositorio nuevo de GitHub.
          2. Pon los secretos CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID y STATS_ADMIN_KEY y corre los flujos.
          3. Abre una conversación con Claude en ese repositorio: CLAUDE.md le da todo el contexto.
          Las claves (si el repositorio es privado) van en CLAVES.txt o en CLAVES-cifradas.zip (contraseña: tu BACKUP_PASSWORD).

          La base de datos va cifrada; para abrirla: \`openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in estadisticas-d1.sql.gz.cifrado -out d1.sql.gz -pass pass:TU_STATS_ADMIN_KEY\`
          NOTES
          gh release delete "$TAG" -R "$REPO" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/* -R "$REPO" --target main --title "Respaldo $(TZ=America/Mexico_City date +%d/%m/%Y)" --notes-file notes.md --prerelease
          # Conservar solo los últimos 6 respaldos.
          gh api "repos/$REPO/releases?per_page=100" -q '.[] | select(.tag_name|startswith("respaldo-")) | .tag_name' | sort -r | tail -n +7 | while read t; do gh release delete "$t" -R "$REPO" -y --cleanup-tag; done
          echo "::notice::Respaldo $TAG listo"
