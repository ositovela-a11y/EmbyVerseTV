# Servidor de estadísticas (quién instala y usa cada app, separado por app principal y vendedores).
#   1) Prueba el servidor con una base de datos local (siempre).
#   2) Lo publica en tu cuenta gratis de Cloudflare (solo si ya pusiste los secretos CLOUDFLARE_API_TOKEN,
#      CLOUDFLARE_ACCOUNT_ID y STATS_ADMIN_KEY en GitHub) y escribe su dirección en config/stats.json,
#      que es donde las apps y el panel la buscan.
name: Servidor de estadísticas
on:
  push:
    branches: [main, beta]
    paths: ['stats-worker/**', '.github/workflows/stats-worker.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: stats-worker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --no-warnings stats-worker/test/worker.test.mjs

  publicar:
    needs: prueba
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_KEY: ${{ secrets.STATS_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: ¿Ya está conectada la cuenta de Cloudflare?
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$ADMIN_KEY" ]; then echo "ok=1" >> $GITHUB_OUTPUT
          else echo "::notice::Falta conectar Cloudflare (secretos CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID y STATS_ADMIN_KEY). El servidor no se publicó."; fi
      - name: Base de datos, clave del panel y publicación
        if: steps.ready.outputs.ok == '1'
        working-directory: stats-worker
        run: |
          npm i -g wrangler@4.20.0 > /dev/null 2>&1
          dbid() { wrangler d1 list --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const x=JSON.parse(s).find(d=>d.name==='embyverse-stats');console.log(x?(x.uuid||x.id||''):'')}catch{console.log('')}})"; }
          ID=$(dbid)
          if [ -z "$ID" ]; then wrangler d1 create embyverse-stats; ID=$(dbid); fi
          [ -n "$ID" ] || { echo "::error::No se pudo crear la base de datos en Cloudflare (revisa los permisos del token: Workers y D1 en Editar)."; exit 1; }
          sed -i "s/database_id = \"LOCAL\"/database_id = \"$ID\"/" wrangler.toml
          wrangler d1 execute embyverse-stats --remote --file=schema.sql -y
          wrangler deploy 2>&1 | tee deploy.txt
          printf '%s' "$ADMIN_KEY" | wrangler secret put ADMIN_KEY
          URL=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' deploy.txt | head -1)
          [ -n "$URL" ] || { echo "::error::Se publicó pero no salió la dirección. En Cloudflare entra una vez a «Workers y Pages» para que te asigne tu subdominio workers.dev."; exit 1; }
          curl -fsS "$URL/v1" && echo
          echo "URL=$URL" >> $GITHUB_ENV
      - name: Guardar la dirección en config/stats.json (la usan las apps y el panel)
        if: steps.ready.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{\n  "url": "%s"\n}\n' "$URL" > web-player/config/stats.json
          if ! git diff --quiet -- web-player/config/stats.json 2>/dev/null || [ -z "$(git ls-files web-player/config/stats.json)" ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web-player/config/stats.json && git commit -m "Estadísticas: dirección del servidor" && git push
            # Lo que sube este flujo no dispara otros flujos: se publica el sitio a mano.
            gh workflow run web.yml --ref main
          fi
          echo "::notice::Servidor de estadísticas listo: $URL"
