# Publica EmbyVerse Web en la rama gh-pages → https://<usuario>.github.io/<repositorio>/
name: EmbyVerse Web
on:
  push:
    branches: [main]
    paths: ['web-player/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar en gh-pages
        run: |
          cd web-player
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Publicar EmbyVerse Web ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
