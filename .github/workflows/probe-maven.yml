name: Consulta temporal de librerías
on: { push: { branches: [probe-maven] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in org/jellyfin/media3/media3-ffmpeg-decoder io/github/anilbeesetti/nextlib-media3ext; do
            echo "== $u"; curl -s https://repo1.maven.org/maven2/$u/maven-metadata.xml | grep -o "<version>[^<]*" | tail -8
          done
          v=$(curl -s https://repo1.maven.org/maven2/org/jellyfin/media3/media3-ffmpeg-decoder/maven-metadata.xml | grep -o "<release>[^<]*" | cut -d'>' -f2)
          echo "== pom $v"; curl -s https://repo1.maven.org/maven2/org/jellyfin/media3/media3-ffmpeg-decoder/$v/media3-ffmpeg-decoder-$v.pom | grep -A3 -i "license\|<dependency>" | head -40
