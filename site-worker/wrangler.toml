# Sitio público con dominio propio (eversetv.com). Sirve lo mismo que GitHub Pages pero con tu dirección,
# sin que se vea «github» ni tu usuario. El dominio se conecta en Cloudflare: Workers › eversetv-site ›
# Settings › Domains & Routes › Add › Custom domain.
name = "eversetv-site"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
routes = [
  { pattern = "eversetv.com", custom_domain = true },
  { pattern = "www.eversetv.com", custom_domain = true },
]

# Copia del sitio publicado (sin las APK), por si GitHub falla. La arma el flujo «Dominio propio» en ./copia.
# run_worker_first: el Worker decide; la copia solo se usa cuando GitHub no responde o ya no tiene el archivo.
[assets]
directory = "./copia"
binding = "ASSETS"
run_worker_first = true
